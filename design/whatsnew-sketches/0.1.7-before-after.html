<h1>0.1.7 What's new graphic</h1>
<p class="sub">Old UI left, new UI right. Dusk wallpaper inside the app, window tilted in CSS 3D. Fonts are embedded.</p>
<template id="dlg"><div class="dlg"><div class="hero"></div><div class="txt"><div class="eb">What's new in 0.1.7</div><div class="tt">Bring your own agents</div>
<ul><li><b>Add any agent</b><span>Claude, Codex, anything in the ACP registry, all from one Providers page.</span></li></ul></div></div></template>
<div id="root"></div>
<script>
const W = 700, H = 267, SX = 350;
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const scatter = (seed, n, x0, x1, y0, y1, skip) => { const r = rng(seed), out = []; let guard = 0; while (out.length < n && guard++ < 2000) { const x = x0 + r() * (x1 - x0), y = y0 + r() * (y1 - y0), k = r(); if (!skip.some(([a, b, c, d]) => x > a && x < c && y > b && y < d)) out.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.8 + k * .9).toFixed(2)}" fill="#fff" opacity="${(.5 + r() * .45).toFixed(2)}"/>`); } return out.join(""); };
const grid = (seed, x0, x1, y0, y1, cell, skip, rmax = 1.5) => { const r = rng(seed); let out = ""; for (let gx = x0; gx < x1; gx += cell) for (let gy = y0; gy < y1; gy += cell) { const x = gx + r() * cell, y = gy + r() * cell, k = r() ** 2; if (r() < .5 || skip.some(([a, b, c, d]) => x > a && x < c && y > b && y < d)) continue; out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.7 + k * rmax).toFixed(2)}" fill="#fff" opacity="${(.45 + r() * .5).toFixed(2)}"/>`; } return out; };
const star = (x, y, r, o = .95) => `<path transform="translate(${x} ${y}) scale(${r})" d="M0-1C.07-.3.3-.07 1 0 .3.07.07.3 0 1-.07.3-.3.07-1 0-.3-.07-.07-.3 0-1Z" fill="#fff" opacity="${o}"/>`;
const PUFFS = [[-78,12,30],[-44,-2,42],[0,-14,52],[46,-4,44],[84,12,32],[-14,18,40],[36,20,38]];
const cloud = (id, cx, cy, k, op = 1, sx = 1) => {
  const c = f => PUFFS.map(([x, y, r]) => f(cx + x * k, cy + y * k, r * k)).join("");
  return `<g filter="url(#${id}f)" opacity="${op}" transform="translate(${cx} ${cy}) scale(${sx} 1) translate(${-cx} ${-cy})">
    ${c((x, y, r) => `<circle cx="${x + k * 4}" cy="${y + k * 8}" r="${r}" fill="#121744" opacity=".8"/>`)}
    ${c((x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id}c)"/>`)}
    ${c((x, y, r) => `<circle cx="${x - r * .18}" cy="${y - r * .3}" r="${r * .5}" fill="#c9d1ff" opacity=".55"/>`)}</g>`;
};
const row = (id, x0, y0, n, gap, k, wob) => Array.from({ length: n }, (_, i) => cloud(id, x0 + i * gap, y0 + Math.sin(i * 1.7) * wob, k * (1 - i * .03), .9 - i * .04, 1.3)).join("");
const WIN = `M${SX} 430V108H626Q650 108 650 132V430Z`;
const bgSvg = id => {
  const stars = [[52,62,8],[430,32,6],[636,130,5]].map(([x,y,r])=>star(x,y,r)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>
   <radialGradient id="${id}g" cx=".5" cy="1.08" r="1.15"><stop offset="0" stop-color="#fff1a8"/><stop offset=".22" stop-color="#ffd24d"/><stop offset=".45" stop-color="#ff9448"/><stop offset=".7" stop-color="#f27a9a"/><stop offset="1" stop-color="#a98ef0"/></radialGradient>
   <filter id="${id}n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs>
   <rect width="${W}" height="${H}" fill="url(#${id}g)"/><rect width="${W}" height="${H}" filter="url(#${id}n)" style="mix-blend-mode:overlay" opacity=".6"/>
   ${grid(5, 6, 694, 6, 110, 40, [[150, 30, 550, 112]])}${grid(9, 6, 48, 110, 261, 50, [])}${grid(13, 652, 694, 110, 261, 50, [])}${stars}<text x="150" y="132" text-anchor="middle" fill="#3a1a6e" font-family="SBLiquid,Questrial,sans-serif" font-size="100">0</text><text x="350" y="132" text-anchor="middle" fill="#3a1a6e" font-family="SBLiquid,Questrial,sans-serif" font-size="100">1</text><text x="550" y="132" text-anchor="middle" fill="#3a1a6e" font-family="SBLiquid,Questrial,sans-serif" font-size="100">7</text><rect x="238" y="103" width="24" height="24" rx="7" fill="#3a1a6e"/><rect x="438" y="103" width="24" height="24" rx="7" fill="#3a1a6e"/></svg>`;
};
const winSvg = id => {
  const dots = grid(21, 356, 644, 112, 266, 30, [[268, 128, 432, 154], [198, 158, 502, 238]], 1.3);
  const old = `<path d="M50 430V132Q50 108 74 108H${SX}V430Z" fill="#161921"/>
    <rect x="68" y="122" width="14" height="14" rx="3" fill="none" stroke="#5a6072" stroke-width="1.6"/><path d="M73.5 122v14" stroke="#5a6072" stroke-width="1.6"/>
    <rect x="275" y="136" width="150" height="8" rx="3" fill="#4a4f5e"/>
    <rect x="200" y="160" width="300" height="76" rx="8" fill="#1d212b" stroke="#2c313d"/><rect x="218" y="172" width="110" height="5" rx="2" fill="#434857"/>
    <rect x="218" y="208" width="40" height="14" rx="4" fill="#262b36"/><rect x="264" y="208" width="50" height="14" rx="4" fill="#262b36"/><rect x="320" y="208" width="40" height="14" rx="4" fill="#262b36"/>`;
  const neu = `<path d="${WIN}" fill="url(#${id}k)"/>
    <g clip-path="url(#${id}W)">${dots}</g>
    <path d="${WIN}" fill="url(#${id}d)"/>
    <rect x="275" y="134" width="150" height="10" rx="5" fill="#fff"/><rect x="390" y="149" width="35" height="2.5" rx="1.2" fill="#7c9bff"/>
    <rect x="200" y="160" width="300" height="76" rx="18" fill="#0e121c" fill-opacity=".9" stroke="#fff" stroke-opacity=".14"/><rect x="220" y="174" width="118" height="6" rx="3" fill="#fff" opacity=".28"/>
    <rect x="218" y="208" width="68" height="20" rx="10" fill="#fff" opacity=".1"/><circle cx="231" cy="218" r="4.5" fill="#ffb454"/>
    <rect x="292" y="208" width="52" height="20" rx="10" fill="#fff" opacity=".1"/><rect x="350" y="208" width="42" height="20" rx="10" fill="#fff" opacity=".1"/>
    <path d="M${SX} 108H626Q650 108 650 132" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>
   <linearGradient id="${id}k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1240"/><stop offset=".55" stop-color="#26399a"/><stop offset="1" stop-color="#5b57b8"/></linearGradient>
   <linearGradient id="${id}d" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#080c1c" stop-opacity="0"/><stop offset="1" stop-color="#080c1c" stop-opacity=".85"/></linearGradient>
   <radialGradient id="${id}c" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#a9b4f0"/><stop offset=".6" stop-color="#5668b8"/><stop offset="1" stop-color="#2c3573"/></radialGradient>
   <filter id="${id}f" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="23" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="5"/><feGaussianBlur stdDeviation=".5"/></filter>
   <filter id="${id}s" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4a1500" flood-opacity=".4"/></filter>
   <clipPath id="${id}W"><path d="${WIN}"/></clipPath>
   <clipPath id="${id}L"><rect width="${SX}" height="${H + 200}"/></clipPath><clipPath id="${id}R"><rect x="${SX}" width="${W}" height="${H + 200}"/></clipPath></defs>
   <g filter="url(#${id}s)"><g clip-path="url(#${id}L)">${old}</g><g clip-path="url(#${id}R)">${neu}</g></g>
   <path d="M${SX} 108V430" stroke="#fff" stroke-width="3"/></svg>`;
};
const stage = id => `<div class="stage">${bgSvg(id + "b")}<div class="tilt">${winSvg(id + "w")}</div></div>`;
const root = document.getElementById("root");
const s = document.createElement("section");
s.innerHTML = `<div class="row"><div class="big">${stage("a")}</div></div>`;
const d = document.getElementById("dlg").content.cloneNode(true);
d.querySelector(".hero").innerHTML = stage("c");
s.querySelector(".row").append(d); root.append(s);
</script>
