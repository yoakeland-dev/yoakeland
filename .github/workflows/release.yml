# Builds the desktop app on every platform and publishes the installers as a GitHub prerelease.
# Push a tag (git tag v0.1.0 && git push --tags) to release; the tag should match package.json's
# version, which is what names the installers. Run it by hand to build without releasing.
# The landing page (yoake.land) picks the newest release's installers by file extension.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          # One runner builds both Mac architectures: yoakeland-<v>-arm64.dmg and yoakeland-<v>.dmg.
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The mock-server preview route is a dev tool; it doesn't ship.
      - run: rm -rf src/routes/__preview
      # The tests gate the release; once is enough, so only the Linux runner runs them.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: npm run check && node --test src/lib/*.test.js electron/*.test.js
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      # Checksums of every installer, so a download can be checked against this release.
      - run: (cd installers && sha256sum * > SHA256SUMS)
      # Always a prerelease: GitHub's own /releases/latest never points at one, so the landing page
      # reads the releases list instead.
      - run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            --notes "Pre-release. Linux is the primary platform; the macOS and Windows builds are experimental and unsigned."
        env:
          GH_TOKEN: ${{ github.token }}
