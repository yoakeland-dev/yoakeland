# Early Linux build with the early icon, published to the separate early repo so the stable
# repo's release list (read by the landing page and the server installer) stays stable-only.
# Needs an EARLY_TOKEN secret: a fine-grained token with contents:write on yoakeland-dev/yoakeland-early.
name: Early

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  EARLY_REPO: yoakeland-dev/yoakeland-early

jobs:
  early:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rm -rf src/routes/__preview
      - run: |
          cp electron/icon-early.png electron/icon.png
          cp static/logo-early.png static/logo.png
      # The server of the same moment goes inside the app (scripts/bundle-server.sh), so the nightly's
      # client and server always match, and its first run needs no download.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yoakeland-dev/yoakeland-server
          path: server-src
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server-src/go.mod
      - run: |
          # To the minute, so a second run on the same day gets its own tag and sorts above the first.
          STAMP=$(date -u +%Y%m%d%H%M)
          V=$(node -p "require('./package.json').version")-early.$STAMP
          echo "V=$V" >> "$GITHUB_ENV"
          echo "TAG=early-$STAMP" >> "$GITHUB_ENV"
          (cd server-src && go vet ./...)
          scripts/bundle-server.sh server-src "$V" linux-x64
      # YOAKE_VERSION puts the nightly version in the app's UI (the About dialog reads it at build time).
      - run: npm run build
        env:
          YOAKE_VERSION: ${{ env.V }}
      # Own product name and app id: an early build installs beside stable, and its window class (the
      # dock's icon match) differs. The version is the last released number plus -early.<date>.
      - run: |
          npx electron-builder --linux --publish never \
            -c.productName="Yoakeland Early" -c.appId=com.aveline.yoake-gui.early -c.artifactName='Yoakeland-Early-${version}.${ext}' \
            -c.extraMetadata.version="$V" -c.extraMetadata.productName="Yoakeland Early" -c.extraMetadata.desktopName=Yoakeland-Early.desktop -c.linux.executableName=Yoakeland-Early
      - run: (cd dist && sha256sum *.AppImage > SHA256SUMS)
      - run: |
          gh release create "$TAG" dist/*.AppImage dist/SHA256SUMS \
            --repo "$EARLY_REPO" --title "$TAG" --prerelease \
            --notes "Early build of $GITHUB_SHA with the server of the same moment inside. Unstable."
          # keep a week
          gh release list --repo "$EARLY_REPO" --limit 100 --json tagName --jq '.[7:][].tagName' |
            xargs -rn1 gh release delete --repo "$EARLY_REPO" --cleanup-tag --yes
        env:
          GH_TOKEN: ${{ secrets.EARLY_TOKEN }}
